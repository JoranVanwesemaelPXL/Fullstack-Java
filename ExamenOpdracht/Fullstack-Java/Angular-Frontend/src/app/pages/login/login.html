<div class="min-h-screen bg-[#FFF8F0] px-6 py-20">
  <div class="mx-auto max-w-md rounded-3xl bg-white p-8 shadow-lg">
    <div class="mb-6 text-center">
      <h1 class="text-3xl font-black">
        Food<span class="text-[#E97832]">Express</span>
      </h1>
      <p class="mt-2 text-[#78665B]">Welkom terug!</p>
    </div>

    <h2 class="mb-6 text-xl font-bold">Inloggen</h2>

    <form class="space-y-4" [formGroup]="form" (ngSubmit)="submit()">
      <div>
        <label for="username" class="mb-2 block text-sm font-semibold">Gebruikersnaam</label>
        <input id="username" type="text" formControlName="username" placeholder="bv. jan"
          autocomplete="username"
          class="w-full rounded-xl border border-orange-100 p-3 outline-none focus:border-[#E97832]">
        @if (form.controls.username.touched && form.controls.username.invalid) {
          <p class="mt-1 text-sm text-red-600">Vul een naam in van minstens 2 tekens.</p>
        }
      </div>

      <fieldset>
        <legend class="mb-2 block text-sm font-semibold">Ik ben een</legend>
        <div class="grid grid-cols-3 gap-2">
          @for (role of roles; track role) {
            <label
              class="cursor-pointer rounded-xl border p-3 text-center text-sm font-semibold transition"
              [class]="form.controls.role.value === role
                ? 'border-[#E97832] bg-orange-50 text-[#E97832]'
                : 'border-orange-100 hover:border-orange-200'">
              <input type="radio" class="sr-only" formControlName="role" [value]="role">
              {{ roleLabels[role] }}
            </label>
          }
        </div>
      </fieldset>

      <button type="submit"
        class="w-full rounded-xl bg-[#E97832] p-3 font-bold text-white hover:bg-[#C85B22]">
        Inloggen
      </button>
    </form>

    <a routerLink="/welcome"
      class="mt-6 block text-center text-sm font-semibold text-[#E97832]">
      ← Terug naar home
    </a>
  </div>
</div>
