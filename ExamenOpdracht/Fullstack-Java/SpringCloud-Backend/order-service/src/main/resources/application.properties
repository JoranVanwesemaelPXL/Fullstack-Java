spring.application.name=order-service
server.port=8082

# --- Database (eigen PostgreSQL, zie docker-compose.yml) ---
spring.datasource.url=jdbc:postgresql://localhost:5434/order_db
spring.datasource.username=mealbox
spring.datasource.password=mealbox

# --- JPA ---
# update: tabellen worden aangemaakt/aangepast op basis van de entities (ok voor lokaal ontwikkelen)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# --- Actuator ---
management.endpoints.web.exposure.include=health,info
